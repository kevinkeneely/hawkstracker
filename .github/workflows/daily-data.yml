name: Daily data refresh

on:
  schedule:
    # Runs at 8:00 UTC every day = 4:00 AM ET during EDT, 3:00 AM ET during EST.
    # GitHub Actions schedules are always UTC; we accept the ET shift twice a year.
    - cron: '0 8 * * *'
  workflow_dispatch:  # Adds the "Run workflow" button in the Actions tab.

# Give the GITHUB_TOKEN permission to push the auto-commit back to main.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch player and team data from NBA.com
        run: python -m pipeline.fetch

      - name: Fetch standings from NBA.com
        run: python -m pipeline.fetch_standings

      - name: Transform player data
        run: python -m pipeline.transform

      - name: Transform team data
        run: python -m pipeline.transform_team

      - name: Transform standings data
        run: python -m pipeline.transform_standings

      - name: Commit and push updated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json app/public/*.json
          if git diff --staged --quiet; then
            echo "No data changes today — nothing to commit."
          else
            git commit -m "Daily data refresh — $(date -u +%Y-%m-%d)"
            git push
          fi